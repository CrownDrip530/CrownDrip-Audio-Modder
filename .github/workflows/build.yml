name: Scaffold and Build CrownDrip Audio Modder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Scaffold project files (idempotent - only writes if missing)
        shell: bash
        run: |
          mkdir -p app/gui assets

          if [ ! -f requirements.txt ]; then
          cat > requirements.txt << 'PYEOF'
          PySide6>=6.6.0
          sounddevice>=0.4.6
          numpy>=1.24.0
          scipy>=1.11.0
          pydub>=0.25.1
          PYEOF
          fi

          if [ ! -f .gitignore ]; then
          cat > .gitignore << 'PYEOF'
          __pycache__/
          *.pyc
          .venv/
          venv/
          build/
          dist/
          *.spec
          .vscode/
          .idea/
          PYEOF
          fi

          if [ ! -f app/main.py ]; then
          cat > app/main.py << 'PYEOF'
          """
          main.py
          Entry point for CrownDrip Audio Modder.
          """

          import sys
          from pathlib import Path

          sys.path.append(str(Path(__file__).resolve().parent))

          from gui.main_window import run

          if __name__ == "__main__":
              run()
          PYEOF
          fi

          if [ ! -f app/config.py ]; then
          cat > app/config.py << 'PYEOF'
          """
          config.py
          Handles all persistent memory for CrownDrip Audio Modder:
          - App settings (mic gain, deep fry on/off, selected devices, effect params)
          - Soundboard library (mp3 file references + custom names)

          Everything lives under %APPDATA%/CrownDripAudioModder/ so it survives
          closing the app, rebooting, or even deleting the original mp3 you uploaded
          (we copy it into our own storage folder).
          """

          import json
          import os
          import shutil
          import uuid
          from pathlib import Path

          APP_NAME = "CrownDripAudioModder"

          APP_DATA_DIR = Path(os.getenv("APPDATA", Path.home())) / APP_NAME
          SOUNDS_DIR = APP_DATA_DIR / "sounds"
          CONFIG_FILE = APP_DATA_DIR / "config.json"

          DEFAULT_CONFIG = {
              "mic_device": None,
              "output_device": None,
              "mic_gain_db": 0.0,
              "monitor_enabled": False,
              "effects": {
                  "deep_fry": {
                      "enabled": False,
                      "drive": 8.0,
                      "bitcrush_depth": 6,
                      "eq_boost_db": 10.0
                  }
              },
              "soundboard": []
          }


          def _ensure_dirs():
              APP_DATA_DIR.mkdir(parents=True, exist_ok=True)
              SOUNDS_DIR.mkdir(parents=True, exist_ok=True)


          def load_config() -> dict:
              _ensure_dirs()
              if not CONFIG_FILE.exists():
                  save_config(DEFAULT_CONFIG)
                  return json.loads(json.dumps(DEFAULT_CONFIG))

              try:
                  with open(CONFIG_FILE, "r", encoding="utf-8") as f:
                      data = json.load(f)
              except (json.JSONDecodeError, OSError):
                  data = {}

              merged = _deep_merge_defaults(DEFAULT_CONFIG, data)
              return merged


          def _deep_merge_defaults(defaults: dict, data: dict) -> dict:
              result = dict(defaults)
              for key, value in data.items():
                  if key in defaults and isinstance(defaults[key], dict) and isinstance(value, dict):
                      result[key] = _deep_merge_defaults(defaults[key], value)
                  else:
                      result[key] = value
              return result


          def save_config(config: dict):
              _ensure_dirs()
              with open(CONFIG_FILE, "w", encoding="utf-8") as f:
                  json.dump(config, f, indent=2)


          def add_sound_to_library(config: dict, source_path: str, display_name: str) -> dict:
              _ensure_dirs()
              source_path = Path(source_path)
              ext = source_path.suffix or ".mp3"
              file_id = str(uuid.uuid4())
              stored_filename = f"{file_id}{ext}"
              dest_path = SOUNDS_DIR / stored_filename

              shutil.copy2(source_path, dest_path)

              entry = {
                  "id": file_id,
                  "name": display_name.strip() or source_path.stem,
                  "filename": stored_filename,
                  "volume": 1.0
              }
              config["soundboard"].append(entry)
              save_config(config)
              return entry


          def rename_sound(config: dict, sound_id: str, new_name: str):
              for entry in config["soundboard"]:
                  if entry["id"] == sound_id:
                      entry["name"] = new_name.strip() or entry["name"]
                      break
              save_config(config)


          def remove_sound(config: dict, sound_id: str):
              entry = next((e for e in config["soundboard"] if e["id"] == sound_id), None)
              if entry:
                  file_path = SOUNDS_DIR / entry["filename"]
                  if file_path.exists():
                      try:
                          file_path.unlink()
                      except OSError:
                          pass
                  config["soundboard"] = [e for e in config["soundboard"] if e["id"] != sound_id]
                  save_config(config)


          def get_sound_path(entry: dict) -> Path:
              return SOUNDS_DIR / entry["filename"]
          PYEOF
          fi

          if [ ! -f app/soundboard.py ]; then
          cat > app/soundboard.py << 'PYEOF'
          """
          soundboard.py
          Manages loading mp3s into numpy arrays and playing them mixed into the
          outgoing audio stream. Uses pydub to decode mp3 -> PCM.
          """

          import numpy as np
          from pydub import AudioSegment
          from pathlib import Path
          import threading


          class SoundboardPlayer:
              def __init__(self, samplerate: int = 48000, channels: int = 2):
                  self.samplerate = samplerate
                  self.channels = channels
                  self._lock = threading.Lock()
                  self._active_clips = []
                  self._cache = {}

              def _decode(self, filepath: Path) -> np.ndarray:
                  key = str(filepath)
                  if key in self._cache:
                      return self._cache[key]

                  seg = AudioSegment.from_file(filepath)
                  seg = seg.set_frame_rate(self.samplerate).set_channels(self.channels)
                  samples = np.array(seg.get_array_of_samples()).astype(np.float32)
                  samples /= (2 ** (8 * seg.sample_width - 1))

                  if self.channels > 1:
                      samples = samples.reshape((-1, self.channels))
                  else:
                      samples = samples.reshape((-1, 1))

                  self._cache[key] = samples
                  return samples

              def play(self, filepath: Path, volume: float = 1.0):
                  audio = self._decode(filepath)
                  with self._lock:
                      self._active_clips.append({"audio": audio, "pos": 0, "volume": volume})

              def stop_all(self):
                  with self._lock:
                      self._active_clips.clear()

              def is_playing(self) -> bool:
                  with self._lock:
                      return len(self._active_clips) > 0

              def read_block(self, num_frames: int) -> np.ndarray:
                  out = np.zeros((num_frames, self.channels), dtype=np.float32)
                  with self._lock:
                      still_active = []
                      for clip in self._active_clips:
                          audio = clip["audio"]
                          pos = clip["pos"]
                          remaining = len(audio) - pos
                          take = min(num_frames, remaining)
                          if take > 0:
                              out[:take] += audio[pos:pos + take] * clip["volume"]
                              clip["pos"] += take
                          if clip["pos"] < len(audio):
                              still_active.append(clip)
                      self._active_clips = still_active

                  np.clip(out, -1.0, 1.0, out=out)
                  return out
          PYEOF
          fi

          if [ ! -f app/effects.py ]; then
          cat > app/effects.py << 'PYEOF'
          """
          effects.py
          Extensible audio effects chain.
          """

          import numpy as np


          class Effect:
              name = "base"

              def __init__(self, enabled=False, params=None):
                  self.enabled = enabled
                  self.params = params or {}

              def process(self, signal: np.ndarray, samplerate: int) -> np.ndarray:
                  raise NotImplementedError

              def to_dict(self):
                  return {"enabled": self.enabled, "params": self.params}

              def load_dict(self, data: dict):
                  self.enabled = data.get("enabled", self.enabled)
                  self.params.update(data.get("params", {}))


          class DeepFryEffect(Effect):
              name = "deep_fry"

              def __init__(self, enabled=False, drive=8.0, bitcrush_depth=6, eq_boost_db=10.0):
                  super().__init__(enabled, {
                      "drive": drive,
                      "bitcrush_depth": bitcrush_depth,
                      "eq_boost_db": eq_boost_db,
                  })

              def process(self, signal: np.ndarray, samplerate: int) -> np.ndarray:
                  drive = float(self.params.get("drive", 8.0))
                  bit_depth = int(self.params.get("bitcrush_depth", 6))
                  eq_boost_db = float(self.params.get("eq_boost_db", 10.0))

                  x = signal.copy()
                  x = np.tanh(x * drive)
                  x = self._mid_boost(x, samplerate, eq_boost_db)

                  levels = 2 ** max(2, bit_depth)
                  x = np.round(x * levels) / levels

                  x = np.clip(x * 1.5, -1.0, 1.0)
                  return x

              @staticmethod
              def _mid_boost(x: np.ndarray, samplerate: int, boost_db: float) -> np.ndarray:
                  if boost_db == 0:
                      return x

                  freq = 2000.0
                  Q = 1.2
                  A = 10 ** (boost_db / 40.0)
                  w0 = 2 * np.pi * freq / samplerate
                  alpha = np.sin(w0) / (2 * Q)
                  cos_w0 = np.cos(w0)

                  b0 = 1 + alpha * A
                  b1 = -2 * cos_w0
                  b2 = 1 - alpha * A
                  a0 = 1 + alpha / A
                  a1 = -2 * cos_w0
                  a2 = 1 - alpha / A

                  b = np.array([b0, b1, b2]) / a0
                  a = np.array([1.0, a1 / a0, a2 / a0])

                  from scipy.signal import lfilter
                  if x.ndim == 1:
                      return lfilter(b, a, x).astype(np.float32)
                  else:
                      out = np.zeros_like(x)
                      for ch in range(x.shape[1]):
                          out[:, ch] = lfilter(b, a, x[:, ch])
                      return out.astype(np.float32)


          class GainEffect(Effect):
              name = "gain"

              def __init__(self, enabled=True, gain_db=0.0):
                  super().__init__(enabled, {"gain_db": gain_db})

              def process(self, signal: np.ndarray, samplerate: int) -> np.ndarray:
                  gain_db = float(self.params.get("gain_db", 0.0))
                  factor = 10 ** (gain_db / 20.0)
                  return np.clip(signal * factor, -1.0, 1.0)


          class EffectChain:
              def __init__(self):
                  self.gain = GainEffect(enabled=True, gain_db=0.0)
                  self.deep_fry = DeepFryEffect(enabled=False)
                  self.effects = [self.deep_fry]

              def register(self, effect: Effect):
                  self.effects.append(effect)

              def process(self, signal: np.ndarray, samplerate: int) -> np.ndarray:
                  out = self.gain.process(signal, samplerate)
                  for fx in self.effects:
                      if fx.enabled:
                          out = fx.process(out, samplerate)
                  return out

              def set_deep_fry_enabled(self, enabled: bool):
                  self.deep_fry.enabled = enabled

              def set_mic_gain_db(self, gain_db: float):
                  self.gain.params["gain_db"] = gain_db

              def to_config_dict(self) -> dict:
                  return {
                      "mic_gain_db": self.gain.params.get("gain_db", 0.0),
                      "effects": {
                          "deep_fry": self.deep_fry.to_dict()
                      }
                  }

              def load_config_dict(self, config: dict):
                  self.gain.params["gain_db"] = config.get("mic_gain_db", 0.0)
                  fx_cfg = config.get("effects", {}).get("deep_fry", {})
                  self.deep_fry.load_dict(fx_cfg)
          PYEOF
          fi

          if [ ! -f app/audio_engine.py ]; then
          cat > app/audio_engine.py << 'PYEOF'
          """
          audio_engine.py
          Real-time audio engine: captures your real mic, runs it through the
          EffectChain, mixes in any playing soundboard clips, and streams the result
          out to the virtual cable device.
          """

          import sounddevice as sd
          import numpy as np
          import threading

          from effects import EffectChain
          from soundboard import SoundboardPlayer

          SAMPLE_RATE = 48000
          BLOCK_SIZE = 1024
          CHANNELS = 2


          class AudioEngine:
              def __init__(self, mic_device=None, output_device=None, monitor_device=None):
                  self.mic_device = mic_device
                  self.output_device = output_device
                  self.monitor_device = monitor_device
                  self.monitor_enabled = False

                  self.chain = EffectChain()
                  self.soundboard = SoundboardPlayer(samplerate=SAMPLE_RATE, channels=CHANNELS)

                  self._stream = None
                  self._lock = threading.Lock()
                  self._running = False

              @staticmethod
              def list_input_devices():
                  devices = sd.query_devices()
                  return [
                      {"index": i, "name": d["name"]}
                      for i, d in enumerate(devices)
                      if d["max_input_channels"] > 0
                  ]

              @staticmethod
              def list_output_devices():
                  devices = sd.query_devices()
                  return [
                      {"index": i, "name": d["name"]}
                      for i, d in enumerate(devices)
                      if d["max_output_channels"] > 0
                  ]

              @staticmethod
              def find_vb_cable_output_index():
                  for d in AudioEngine.list_output_devices():
                      if "CABLE Input" in d["name"]:
                          return d["index"]
                  return None

              def start(self):
                  if self._running:
                      return

                  def callback(indata, outdata, frames, time_info, status):
                      if status:
                          pass

                      with self._lock:
                          mic_signal = indata.copy()
                          if mic_signal.shape[1] == 1 and CHANNELS == 2:
                              mic_signal = np.repeat(mic_signal, 2, axis=1)

                          processed = self.chain.process(mic_signal, SAMPLE_RATE)

                          sb_block = self.soundboard.read_block(frames)
                          mixed = np.clip(processed + sb_block, -1.0, 1.0)

                          outdata[:] = mixed

                  self._stream = sd.Stream(
                      samplerate=SAMPLE_RATE,
                      blocksize=BLOCK_SIZE,
                      dtype="float32",
                      channels=CHANNELS,
                      device=(self.mic_device, self.output_device),
                      callback=callback,
                  )
                  self._stream.start()
                  self._running = True

              def stop(self):
                  if self._stream is not None:
                      self._stream.stop()
                      self._stream.close()
                      self._stream = None
                  self._running = False

              def is_running(self):
                  return self._running

              def set_mic_gain_db(self, gain_db: float):
                  with self._lock:
                      self.chain.set_mic_gain_db(gain_db)

              def set_deep_fry_enabled(self, enabled: bool):
                  with self._lock:
                      self.chain.set_deep_fry_enabled(enabled)

              def update_deep_fry_params(self, **kwargs):
                  with self._lock:
                      self.chain.deep_fry.params.update(kwargs)

              def play_sound(self, filepath, volume=1.0):
                  self.soundboard.play(filepath, volume)

              def stop_all_sounds(self):
                  self.soundboard.stop_all()
          PYEOF
          fi

          if [ ! -f app/gui/__init__.py ]; then
          cat > app/gui/__init__.py << 'PYEOF'
          """GUI package for CrownDrip Audio Modder."""
          PYEOF
          fi

          if [ ! -f app/gui/widgets.py ]; then
          cat > app/gui/widgets.py << 'PYEOF'
          """
          gui/widgets.py
          Custom-styled widgets for the gold & black theme.
          """

          from PySide6.QtCore import Qt, QSize, QPropertyAnimation, QEasingCurve, Property, Signal
          from PySide6.QtGui import QPainter, QColor
          from PySide6.QtWidgets import QWidget


          class ToggleSwitch(QWidget):
              toggled = Signal(bool)

              def __init__(self, parent=None, checked=False):
                  super().__init__(parent)
                  self._checked = checked
                  self._circle_pos = 22.0 if checked else 3.0
                  self.setFixedSize(46, 24)
                  self.setCursor(Qt.PointingHandCursor)

                  self._anim = QPropertyAnimation(self, b"circle_pos", self)
                  self._anim.setDuration(160)
                  self._anim.setEasingCurve(QEasingCurve.OutCubic)

              def get_circle_pos(self):
                  return self._circle_pos

              def set_circle_pos(self, pos):
                  self._circle_pos = pos
                  self.update()

              circle_pos = Property(float, get_circle_pos, set_circle_pos)

              def is_checked(self):
                  return self._checked

              def set_checked(self, checked: bool, emit=True):
                  if self._checked == checked:
                      return
                  self._checked = checked
                  self._anim.stop()
                  self._anim.setStartValue(self._circle_pos)
                  self._anim.setEndValue(22.0 if checked else 3.0)
                  self._anim.start()
                  if emit:
                      self.toggled.emit(checked)

              def mousePressEvent(self, event):
                  if event.button() == Qt.LeftButton:
                      self.set_checked(not self._checked)

              def sizeHint(self):
                  return QSize(46, 24)

              def paintEvent(self, event):
                  painter = QPainter(self)
                  painter.setRenderHint(QPainter.Antialiasing)

                  track_color = QColor("#ffd166") if self._checked else QColor("#2a2a2a")
                  border_color = QColor("#ffd166") if self._checked else QColor("#5a4a1a")

                  painter.setPen(border_color)
                  painter.setBrush(track_color)
                  painter.drawRoundedRect(0, 0, self.width(), self.height(), 12, 12)

                  circle_color = QColor("#0d0d0d") if self._checked else QColor("#8a7a4a")
                  painter.setPen(Qt.NoPen)
                  painter.setBrush(circle_color)
                  painter.drawEllipse(int(self._circle_pos), 3, 18, 18)
          PYEOF
          fi

          if [ ! -f app/gui/theme.qss ]; then
          cat > app/gui/theme.qss << 'PYEOF'
